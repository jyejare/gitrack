apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitrack
  labels:
    app: gitrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitrack
  template:
    metadata:
      labels:
        app: gitrack
    spec:
      containers:
        - name: gitrack
          image: quay.io/jyejare_redhat/gitrack:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
