name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit all dependencies
        run: npm audit --include=dev
      - name: Smoke-test the development server
        run: |
          npm run dev > /tmp/next-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/next-dev.log
          exit 1
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
